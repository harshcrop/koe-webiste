document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

one }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"width:18px;height:18px;border-radius:50%;background:oklch(.72 .15 160);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0d1a12\">✓<\u002Fdiv>\n            <span style=\"font-size:13px;color:rgba(255,255,255,.85)\">{{ words }} words inserted<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:rgba(255,255,255,.45)\">⌘Z to undo<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:22px\">\n      <button sc-camel-on-pointer-down=\"{{ holdStart }}\" sc-camel-on-pointer-up=\"{{ holdEnd }}\" sc-camel-on-pointer-leave=\"{{ holdEnd }}\" style=\"font:inherit;cursor:pointer;user-select:none;touch-action:none;display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;color:rgba(255,247,240,.9);background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.18)\" style-hover=\"background:rgba(255,255,255,.11)\" style-active=\"background:oklch(.56 .17 35);color:#fff\">\n        <div style=\"width:8px;height:8px;border-radius:50%;background:oklch(.66 .2 22)\"><\u002Fdiv>Press and hold to try it\n      <\u002Fbutton>\n      <span style=\"font-size:12.5px;color:rgba(255,247,240,.45)\">or hold <span style=\"font-family:'IBM Plex Mono',monospace;color:rgba(255,247,240,.7)\">⌥ Space<\u002Fspan> on this page<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" data-screen-label=\"How it works\" style=\"padding:96px 24px;border-top:.5px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1160px;margin:0 auto\">\n    <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.8px;text-transform:uppercase;color:oklch(.78 .16 62)\">How it works<\u002Fspan>\n    <h2 style=\"margin:14px 0 48px;max-width:640px;font-size:clamp(30px,4.4vw,46px);line-height:1.08;font-weight:700;letter-spacing:-.025em;color:#fff;text-wrap:pretty\">Works in every app with a text cursor.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n      <div style=\"padding:26px;border-radius:16px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font:500 12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.4)\">01<\u002Fspan>\n        <div style=\"display:flex;gap:8px\"><span style=\"font:500 17px 'IBM Plex Mono',monospace;padding:8px 14px;border-radius:9px;background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.16);box-shadow:0 2px 0 rgba(0,0,0,.4)\">⌥<\u002Fspan><span style=\"font:500 17px 'IBM Plex Mono',monospace;padding:8px 22px;border-radius:9px;background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.16);box-shadow:0 2px 0 rgba(0,0,0,.4)\">Space<\u002Fspan><\u002Fdiv>\n        <div><div style=\"font-size:18px;font-weight:600;margin-bottom:6px\">Hold the shortcut<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(255,247,240,.62)\">Push to talk keeps the mic open only while the keys are down. Prefer toggle? Switch it in General.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:16px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font:500 12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.4)\">02<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:4px;height:40px\">\n          <div style=\"width:4px;height:12px;border-radius:2px;background:oklch(.6 .18 32)\"><\u002Fdiv><div style=\"width:4px;height:24px;border-radius:2px;background:oklch(.68 .19 48)\"><\u002Fdiv><div style=\"width:4px;height:36px;border-radius:2px;background:oklch(.78 .16 62)\"><\u002Fdiv><div style=\"width:4px;height:20px;border-radius:2px;background:oklch(.68 .19 48)\"><\u002Fdiv><div style=\"width:4px;height:30px;border-radius:2px;background:oklch(.78 .16 62)\"><\u002Fdiv><div style=\"width:4px;height:14px;border-radius:2px;background:oklch(.6 .18 32)\"><\u002Fdiv><div style=\"width:4px;height:26px;border-radius:2px;background:oklch(.68 .19 48)\"><\u002Fdiv><div style=\"width:4px;height:10px;border-radius:2px;background:oklch(.6 .18 32)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div><div style=\"font-size:18px;font-weight:600;margin-bottom:6px\">Speak naturally<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(255,247,240,.62)\">Talk at your normal pace. Punctuation and filler-word cleanup happen automatically.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:26px;border-radius:16px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font:500 12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.4)\">03<\u002Fspan>\n        <div style=\"height:40px;display:flex;align-items:center;font-size:16px;color:rgba(255,247,240,.85)\">Ship it Thursday.<span style=\"display:inline-block;width:2px;height:20px;margin-left:3px;background:oklch(.78 .16 62)\"><\u002Fspan><\u002Fdiv>\n        <div><div style=\"font-size:18px;font-weight:600;margin-bottom:6px\">Release, and it's typed<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(255,247,240,.62)\">Text lands at your cursor in Mail, Slack, Notion, your editor, anywhere. ⌘Z undoes it.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"features\" data-screen-label=\"Features\" style=\"padding:96px 24px;border-top:.5px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1160px;margin:0 auto\">\n    <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.8px;text-transform:uppercase;color:oklch(.78 .16 62)\">Features<\u002Fspan>\n    <h2 style=\"margin:14px 0 48px;max-width:640px;font-size:clamp(30px,4.4vw,46px);line-height:1.08;font-weight:700;letter-spacing:-.025em;color:#fff;text-wrap:pretty\">Private by design. Fast enough to replace typing.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n\n      <div style=\"grid-column:1/-1;padding:clamp(24px,4vw,40px);border-radius:18px;background:linear-gradient(150deg,#1d1410,#151110 60%);border:.5px solid rgba(255,255,255,.1);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px;align-items:center\">\n        <div>\n          <div style=\"width:44px;height:44px;border-radius:12px;background:oklch(.72 .15 160 / .14);border:.5px solid oklch(.72 .15 160 / .4);display:flex;align-items:center;justify-content:center;margin-bottom:20px\"><i data-lucide=\"shield-check\" stroke-width=\"1.75\" style=\"width:21px;height:21px;color:oklch(.8 .13 160);display:block\"><\u002Fi><\u002Fdiv>\n          <div style=\"font-size:clamp(22px,2.6vw,28px);font-weight:700;letter-spacing:-.02em;margin-bottom:10px\">Nothing leaves this Mac.<\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6;color:rgba(255,247,240,.64);max-width:460px;text-wrap:pretty\">Audio is transcribed locally and discarded. No account, no server round-trip, and it keeps working with Wi-Fi off.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.1)\"><div style=\"width:20px;height:20px;border-radius:50%;background:oklch(.72 .15 160);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0d1a12\">✓<\u002Fdiv><span style=\"font-size:14px;color:rgba(255,247,240,.85)\">Transcription runs on Apple silicon or Intel<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.1)\"><div style=\"width:20px;height:20px;border-radius:50%;background:oklch(.72 .15 160);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0d1a12\">✓<\u002Fdiv><span style=\"font-size:14px;color:rgba(255,247,240,.85)\">Recordings discarded after transcription<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.1)\"><div style=\"width:20px;height:20px;border-radius:50%;background:oklch(.72 .15 160);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0d1a12\">✓<\u002Fdiv><span style=\"font-size:14px;color:rgba(255,247,240,.85)\">History stays on disk, searchable only by you<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px;border-radius:18px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:20px\">\n        <div><div style=\"font-size:19px;font-weight:600;margin-bottom:6px\">Vocabulary<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(255,247,240,.62)\">Names and jargon Kōe should never mishear.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n          <span style=\"padding:6px 11px;border-radius:999px;font-size:12.5px;color:rgba(255,247,240,.85);background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.18)\">Anika Rao<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:999px;font-size:12.5px;color:rgba(255,247,240,.85);background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.18)\">Kubernetes<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:999px;font-size:12.5px;color:rgba(255,247,240,.85);background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.18)\">SOC 2<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:999px;font-size:12.5px;color:rgba(255,247,240,.85);background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.18)\">gRPC<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:999px;font-size:12.5px;color:rgba(255,247,240,.85);background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.18)\">Postgres<\u002Fspan>\n          <span style=\"padding:6px 11px;border-radius:999px;font-size:12.5px;color:#fff;background:linear-gradient(150deg,oklch(.68 .19 48),oklch(.56 .17 35))\">+ Add word<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px;border-radius:18px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:20px\">\n        <div><div style=\"font-size:19px;font-weight:600;margin-bottom:6px\">Lives in the menu bar<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(255,247,240,.62)\">No window to manage. Every action has a shortcut.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;border-radius:12px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.1);padding:6px\">\n          <div style=\"display:flex;align-items:center;padding:9px 10px;font-size:13.5px;color:rgba(255,247,240,.88)\">Start dictation<span style=\"margin-left:auto;font:12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.5)\">⌥Space<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;padding:9px 10px;font-size:13.5px;color:rgba(255,247,240,.88)\">Dictate to clipboard<span style=\"margin-left:auto;font:12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.5)\">⌥⇧Space<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;padding:9px 10px;font-size:13.5px;color:rgba(255,247,240,.88)\">Clean up last transcript<span style=\"margin-left:auto;font:12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.5)\">⌥C<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px;border-radius:18px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:20px\">\n        <div><div style=\"font-size:19px;font-weight:600;margin-bottom:6px\">Searchable history<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(255,247,240,.62)\">Every transcript, tagged with the app it went into.<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:.5px solid rgba(255,255,255,.1)\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\"><span style=\"font-size:11px;padding:2px 7px;border-radius:5px;background:oklch(.68 .19 48 / .14);color:oklch(.82 .14 62);font-weight:500\">Linear<\u002Fspan><span style=\"font:11px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.48)\">12:38 · 137 words<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.55;color:rgba(255,247,240,.8)\">Ship the migration behind a flag on Thursday, then let support know before we flip it for everyone.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px;border-radius:18px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:20px\">\n        <div><div style=\"font-size:19px;font-weight:600;margin-bottom:6px\">Text cleanup<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(255,247,240,.62)\">What you meant, not every “um” you said.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:11px\"><div style=\"width:36px;height:21px;flex:none;border-radius:999px;background:linear-gradient(150deg,oklch(.68 .19 48),oklch(.56 .17 35));display:flex;justify-content:flex-end;padding:2px\"><div style=\"width:17px;height:17px;border-radius:50%;background:#fff\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:13.5px;color:rgba(255,247,240,.85)\">Remove filler words<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:11px\"><div style=\"width:36px;height:21px;flex:none;border-radius:999px;background:linear-gradient(150deg,oklch(.68 .19 48),oklch(.56 .17 35));display:flex;justify-content:flex-end;padding:2px\"><div style=\"width:17px;height:17px;border-radius:50%;background:#fff\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:13.5px;color:rgba(255,247,240,.85)\">Smart punctuation<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:11px\"><div style=\"width:36px;height:21px;flex:none;border-radius:999px;background:rgba(255,255,255,.14);display:flex;padding:2px\"><div style=\"width:17px;height:17px;border-radius:50%;background:rgba(255,247,240,.75)\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:13.5px;color:rgba(255,247,240,.62)\">Match app writing style<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"models\" data-screen-label=\"Models\" style=\"padding:96px 24px;border-top:.5px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1160px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px;align-items:start\">\n    <div style=\"position:sticky;top:96px\">\n      <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.8px;text-transform:uppercase;color:oklch(.78 .16 62)\">Models<\u002Fspan>\n      <h2 style=\"margin:14px 0 16px;font-size:clamp(30px,4.4vw,46px);line-height:1.08;font-weight:700;letter-spacing:-.025em;color:#fff;text-wrap:pretty\">Pick the engine that fits your Mac.<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:rgba(255,247,240,.64);max-width:420px;text-wrap:pretty\">Kōe downloads one model on first launch. Add or switch models any time from Settings.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ models }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <div style=\"padding:18px 20px;border-radius:14px;background:#151110;border:.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <span style=\"font-size:15.5px;font-weight:600;color:#fff\">{{ m.name }}<\u002Fspan>\n            <sc-if value=\"{{ m.rec }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;border-radius:5px;color:#fff;background:oklch(.68 .19 48)\">Recommended<\u002Fspan><\u002Fsc-if>\n            <span style=\"margin-left:auto;font:12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.5)\">{{ m.meta }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:rgba(255,247,240,.62)\">{{ m.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"download\" data-screen-label=\"Download\" style=\"padding:96px 24px;border-top:.5px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1160px;margin:0 auto;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#0b0908 0%,#3c1e0e 50%,#e69440 100%);border:.5px solid rgba(255,255,255,.1);padding:clamp(32px,6vw,72px) clamp(20px,5vw,64px);display:flex;flex-direction:column;align-items:center;text-align:center\">\n    <svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\" width=\"88\" height=\"88\" role=\"img\" aria-label=\"Kōe\" style=\"display:block;width:88px;height:88px;flex:none;border-radius:24px;box-shadow:0 16px 40px rgba(0,0,0,.45);margin-bottom:26px\"><rect width=\"32\" height=\"32\" rx=\"8.5\" fill=\"#fff\"/><rect x=\"10.5\" y=\"7\" width=\"11\" height=\"2.6\" rx=\"1.3\" fill=\"#d9472b\"/><circle cx=\"16\" cy=\"19.2\" r=\"6.1\" fill=\"none\" stroke=\"#141414\" stroke-width=\"2.8\"/><\u002Fsvg>\n    <h2 style=\"margin:0 0 12px;font-size:clamp(32px,5vw,52px);line-height:1.05;font-weight:700;letter-spacing:-.03em;color:#fff\">Download Kōe<\u002Fh2>\n    <p style=\"margin:0 0 32px;font-size:16.5px;line-height:1.55;color:rgba(255,247,240,.78);max-width:480px;text-wrap:pretty\">Pick the build for your Mac. Not sure which one? Apple menu → About This Mac shows your chip.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:14px\">\n      <a href=\"{{ dlArm }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 24px;border-radius:13px;min-width:220px;color:#140f0c;background:#fbf7f2;box-shadow:0 10px 30px rgba(0,0,0,.35)\" style-hover=\"color:#140f0c;background:#fff\">\n        <span style=\"display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600\"><i data-lucide=\"arrow-down-to-line\" stroke-width=\"2\" style=\"width:16px;height:16px;display:block\"><\u002Fi>Apple silicon<\u002Fspan>\n        <span style=\"font:12px 'IBM Plex Mono',monospace;color:rgba(20,15,12,.6)\">M1 and later · .dmg<\u002Fspan>\n      <\u002Fa>\n      <a href=\"{{ dlIntel }}\" style=\"display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 24px;border-radius:13px;min-width:220px;color:#fff;background:rgba(14,11,9,.55);border:.5px solid rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)\" style-hover=\"color:#fff;background:rgba(14,11,9,.7)\">\n        <span style=\"display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600\"><i data-lucide=\"arrow-down-to-line\" stroke-width=\"2\" style=\"width:16px;height:16px;display:block\"><\u002Fi>Intel<\u002Fspan>\n        <span style=\"font:12px 'IBM Plex Mono',monospace;color:rgba(255,247,240,.6)\">2018 and later · .dmg<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n    <span style=\"font:12px/1.5 'IBM Plex Mono',monospace;color:rgba(255,247,240,.6);margin-bottom:48px\">v{{ version }} · macOS 14 Sonoma or later<\u002Fspan>\n    <div style=\"width:100%;max-width:860px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left\">\n      <div style=\"padding:18px;border-radius:14px;background:rgba(14,11,9,.55);border:.5px solid rgba(255,255,255,.14)\"><div style=\"font:500 12px 'IBM Plex Mono',monospace;color:oklch(.82 .14 62);margin-bottom:8px\">1 · Install<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;color:rgba(255,247,240,.85)\">Open the .dmg and drag Kōe into Applications.<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:18px;border-radius:14px;background:rgba(14,11,9,.55);border:.5px solid rgba(255,255,255,.14)\"><div style=\"font:500 12px 'IBM Plex Mono',monospace;color:oklch(.82 .14 62);margin-bottom:8px\">2 · Allow access<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;color:rgba(255,247,240,.85)\">Grant Microphone and Accessibility so Kōe can hear you and type into other apps.<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:18px;border-radius:14px;background:rgba(14,11,9,.55);border:.5px solid rgba(255,255,255,.14)\"><div style=\"font:500 12px 'IBM Plex Mono',monospace;color:oklch(.82 .14 62);margin-bottom:8px\">3 · Get a model<\u002Fdiv><div style=\"font-size:14px;line-height:1.5;color:rgba(255,247,240,.85)\">Whisper Large V3 Turbo downloads on first launch. Then hold ⌥ Space.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"padding:96px 24px;border-top:.5px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:760px;margin:0 auto\">\n    <span style=\"font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.8px;text-transform:uppercase;color:oklch(.78 .16 62)\">FAQ<\u002Fspan>\n    <h2 style=\"margin:14px 0 36px;font-size:clamp(30px,4.4vw,46px);line-height:1.08;font-weight:700;letter-spacing:-.025em;color:#fff\">Questions<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;border-top:.5px solid rgba(255,255,255,.12)\">\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"border-bottom:.5px solid rgba(255,255,255,.12)\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:16px;padding:20px 0;font-size:16.5px;font-weight:500;color:rgba(255,247,240,.92)\">\n            <span style=\"flex:1\">{{ f.q }}<\u002Fspan>\n            <span style=\"font:400 22px/1 'IBM Plex Mono',monospace;color:oklch(.78 .16 62);width:20px;text-align:center\">{{ f.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:0 36px 22px 0;font-size:15px;line-height:1.6;color:rgba(255,247,240,.64);text-wrap:pretty\">{{ f.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"margin-top:auto;border-top:.5px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:28px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px\">\n    <div style=\"display:flex;align-items:center;gap:9px\">\n      <svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\" width=\"22\" height=\"22\" role=\"img\" aria-label=\"Kōe\" style=\"display:block;width:22px;height:22px;flex:none\"><rect width=\"32\" height=\"32\" rx=\"8.5\" fill=\"#fff\"/><rect x=\"10.5\" y=\"7\" width=\"11\" height=\"2.6\" rx=\"1.3\" fill=\"#d9472b\"/><circle cx=\"16\" cy=\"19.2\" r=\"6.1\" fill=\"none\" stroke=\"#141414\" stroke-width=\"2.8\"/><\u002Fsvg>\n      <span style=\"font-size:13.5px;font-weight:600\">Kōe<\u002Fspan>\n      <span style=\"font-size:13px;color:rgba(255,247,240,.45)\">声 · Japanese for voice<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;flex-wrap:wrap;gap:22px\">\n      <a href=\"#download\" style=\"font-size:13px;color:rgba(255,247,240,.6)\" style-hover=\"color:#fff\">Download<\u002Fa>\n      <a href=\"#\" style=\"font-size:13px;color:rgba(255,247,240,.6)\" style-hover=\"color:#fff\">Release notes<\u002Fa>\n      <a href=\"#\" style=\"font-size:13px;color:rgba(255,247,240,.6)\" style-hover=\"color:#fff\">Privacy<\u002Fa>\n      <a href=\"#\" style=\"font-size:13px;color:rgba(255,247,240,.6)\" style-hover=\"color:#fff\">Contact<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;downloadUrlAppleSilicon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#download&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Download&quot;},&quot;downloadUrlIntel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#download&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Download&quot;},&quot;version&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.0.0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Download&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nconst SENTENCES = [\n  \"Ship the migration behind a flag on Thursday, then let support know before we flip it for everyone.\",\n  \"If the error rate holds under half a percent through the weekend, we can drop the flag on Monday.\",\n  \"Anika has the rollback plan, so ping her first if anything looks off.\"\n];\nconst BARS = [8,15,24,12,19,24,10,17,22,9,14,20,7,16].map((h, i) => ({ h, d: (0.55 + (i % 5) * 0.12).toFixed(2) }));\nconst MODELS = [\n  { name: \"Whisper Large V3 Turbo\", rec: true, meta: \"1.6 GB · 99 languages\", desc: \"Fast and highly accurate, even with accents, technical vocabulary and noisy rooms.\" },\n  { name: \"Whisper Medium\", rec: false, meta: \"1.5 GB · 99 languages\", desc: \"Lighter on memory. A good pick for Intel Macs or when battery matters.\" }\n];\nconst FAQS = [\n  { q: \"Does my audio leave my Mac?\", a: \"No. Transcription runs locally on your Mac and the audio is discarded once the text is inserted. Kōe works with no internet connection after the model is downloaded.\" },\n  { q: \"Which apps does it work in?\", a: \"Any app with a text cursor: Mail, Messages, Slack, Notion, Linear, code editors, browsers. You can also dictate straight to the clipboard with ⌥⇧Space.\" },\n  { q: \"Which Macs are supported?\", a: \"macOS 14 Sonoma or later, on Apple silicon or Intel. Larger models run best on Apple silicon; Whisper Medium is the lighter choice for Intel.\" },\n  { q: \"Why does it need Accessibility access?\", a: \"macOS requires it for any app that types into other apps. Kōe uses it only to insert your transcript at the cursor.\" },\n  { q: \"Can it learn names and jargon?\", a: \"Yes. Add words to Vocabulary and Kōe will prefer those spellings, so names like Anika Rao or terms like gRPC come out right.\" }\n];\n\nclass Component extends DCLogic {\n  state = { phase: \"idle\", typed: SENTENCES[0], secs: 0, idx: 0, words: 0, openFaq: 0 };\n  timers = [];\n  user = false;\n\n  componentDidMount() {\n    this.onKeyDown = (e) => {\n      if (e.altKey && e.code === \"Space\") { e.preventDefault(); if (!e.repeat) this.userStart(); }\n    };\n    this.onKeyUp = (e) => {\n      if (e.code === \"Space\" || e.key === \"Alt\") this.userEnd();\n    };\n    window.addEventListener(\"keydown\", this.onKeyDown);\n    window.addEventListener(\"keyup\", this.onKeyUp);\n    this.icons();\n    if (this.props.autoplay ?? true) this.later(() => this.autoCycle(), 1400);\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"keydown\", this.onKeyDown);\n    window.removeEventListener(\"keyup\", this.onKeyUp);\n    this.clearAll();\n    clearInterval(this.tick); clearInterval(this.typer);\n  }\n  icons() {\n    let n = 0;\n    const run = () => { if (window.lucide) window.lucide.createIcons(); else if (n++ < 40) setTimeout(run, 150); };\n    run();\n  }\n  later(fn, ms) { const t = setTimeout(fn, ms); this.timers.push(t); return t; }\n  clearAll() { this.timers.forEach(clearTimeout); this.timers = []; }\n\n  autoCycle() {\n    if (this.user) return;\n    this.start();\n    this.later(() => this.stop(), 2600);\n  }\n  userStart() {\n    this.user = true;\n    this.clearAll();\n    this.start();\n  }\n  userEnd() {\n    if (this.state.phase === \"listening\") this.stop();\n  }\n  start() {\n    if (this.state.phase === \"listening\") return;\n    clearInterval(this.typer); clearInterval(this.tick);\n    this.setState({ phase: \"listening\", secs: 0, typed: \"\" });\n    this.tick = setInterval(() => this.setState(s => ({ secs: s.secs + 1 })), 1000);\n  }\n  stop() {\n    clearInterval(this.tick);\n    const text = SENTENCES[this.state.idx % SENTENCES.length];\n    let i = 0;\n    this.setState({ phase: \"transcribing\" });\n    this.later(() => {\n      this.typer = setInterval(() => {\n        i += 2;\n        this.setState({ typed: text.slice(0, i) });\n        if (i >= text.length) {\n          clearInterval(this.typer);\n          this.setState(s => ({ phase: \"done\", words: text.split(/\\s+/).length, idx: s.idx + 1 }));\n          this.later(() => {\n            this.setState({ phase: \"idle\" });\n            if ((this.props.autoplay ?? true) && !this.user) this.later(() => this.autoCycle(), 1600);\n          }, 2200);\n        }\n      }, 22);\n    }, 450);\n  }\n\n  renderVals() {\n    const p = this.state.phase;\n    const s = this.state.secs;\n    return {\n      version: this.props.version ?? \"1.0.0\",\n      dlArm: this.props.downloadUrlAppleSilicon ?? \"#download\",\n      dlIntel: this.props.downloadUrlIntel ?? \"#download\",\n      typed: this.state.typed,\n      isIdle: p === \"idle\", isListening: p === \"listening\", isTranscribing: p === \"transcribing\", isDone: p === \"done\",\n      clock: `0:${String(s).padStart(2, \"0\")}`,\n      words: this.state.words,\n      bars: BARS,\n      models: MODELS,\n      holdStart: (e) => { e.preventDefault(); this.userStart(); },\n      holdEnd: () => this.userEnd(),\n      faqs: FAQS.map((f, i) => {\n        const open = i === this.state.openFaq;\n        return { ...f, open, sign: open ? \"−\" : \"+\", toggle: () => this.setState({ openFaq: open ? -1 : i }) };\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
